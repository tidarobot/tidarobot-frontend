<mat-sidenav-container class="layout">

  <mat-sidenav mode="side" opened class="sidenav">
    <div class="logo">
      <img src="logo.png" alt="TidaroBot" />
    </div>
    <a mat-button routerLink="/dashboard" routerLinkActive="active-link">Dashboard</a>
    <a mat-button routerLink="/reservations" routerLinkActive="active-link">Reservations</a>
    <a mat-button routerLink="/history" routerLinkActive="active-link">History</a>
    <a mat-button routerLink="/profile" routerLinkActive="active-link">Profile</a>
    <a mat-button routerLink="/stats" routerLinkActive="active-link">Statistics</a>
    @if (auth.isAdmin()) {
      <a mat-button routerLink="/admin" routerLinkActive="active-link">Admin</a>
    }
  </mat-sidenav>

  <mat-sidenav-content>

    <mat-toolbar>
      <span>TidaroBot</span>
      <span class="spacer"></span>
      <button mat-icon-button (click)="auth.logout()" title="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="content">
      <router-outlet />
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
